<!DOCTYPE html>
<html>
    <head>
        <title>Smart Emergency Helper
        </title>
        <meta name="viewport"
        content="width=device-width,initial-scale=1.0">
        <style>
            body {
                text-align:center;
                font-family:Arial;
                font-size: 18px;
                padding: 30px;
                background-color:#f5f5f5;
            }
            .emergency {
                background-color : red ;
                color : white ;
                padding : 15px 30px ;
                font-size: 20px;
                margin: 10px;
                border-radius: 10px;
                box-shadow: 0 4px 8px gray;
                font-weight: bold;
            }
            button {
                width: 250px;
                padding: 15px;
                font-size: 17px;
                border-radius: 10px;
                margin: 10px;
                cursor: pointer;
                transition:0.2s;
            }
            button:hover {
                transform:scale(1.05);
            }
            h1 {
            font-size: 32px;
            color: #d32f2f;
        }
        @media (max-width: 600px){
            button {
                width: 90%;
            }
        }
        input {
            width: 90%;
            padding:12px;
            margin: 8px;
            border-radius: 8px;
        }
        </style>
    </head>
    <body>
        <a href="tel:112">
        <button class="emergency" onclick="alert('Emergency Number:112')">🚨Emergency </button>
        </a>
        <p>For immediate emergency assistance</p>
        <p> Get quick help in an emergency </p>
        <button
         onclick="window.open('https://www.google.com/maps/search/hospitals+near+me')">🏥 Find Nearby Hospital</button>
        <button 
        onclick="document.getElementById('contacts').style.display='block'">👥Trusted Contacts</button>
        <div id="contacts" 
        style="display:none;">
        <input type="text"
        placeholder="Enter trusted person's name">
        <input type="tel"
        placeholder="Enter phone number">
        <button onclick="saveContact()">Save Contact</button>
</div>
        <p>Add a trusted person for emergencies</p>
        <button onclick="alert(' Stay Calm.Move to a safe place and contact emergency services if needed.')">🩹 Safety Guidance</button>
        <p>Stay calm and move to a safe place.</p>
        <p>Get simple safety guidance</p>
        <h1>🚨 Smart Emergency Helper</h1>
        <h2>Quick Help When You Need It</h2>
        <p>📍 Find help near your location</p>
        <button onclick="getLocation()">📍 My Location</button>
        <script>
                function getLocation() {
    if (!navigator.geolocation) {
        alert("Location is not supported by your browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            window.open(
                "https://www.google.com/maps?q=" +
                position.coords.latitude + "," +
                position.coords.longitude
            );
        },
        function(error) {
            if (error.code === 1) {
                alert("Location permission is blocked. Please allow Location permission and try again.");
            } else if (error.code === 2) {
                alert("Location is unavailable. Please turn on GPS and try again.");
            } else {
                alert("Unable to get your location. Please try again.");
            }
        }
    );
}
function saveContact() {
    const name = document.querySelector('#contacts input[type="text"]').value;
    const phone = document.querySelector('#contacts input[type="tel"]').value;

    if (name === "" || phone === "") {
        alert("Please enter name and phone number.");
        return;
    }

    alert("Trusted contact saved successfully!");
}
        </script>
    </body>
</html>
